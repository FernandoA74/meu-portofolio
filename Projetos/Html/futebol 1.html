<!DOCTYPE html> 
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOKObol</title>
  <style>
    /* Estilos base do corpo da página */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('https://wallpaper.forfun.com/fetch/df/df5391fee5683f2034ca45e1c4e4605a.jpeg'); /* Imagem de fundo */
      background-size: cover;       /* Cobre toda a área do ecrã */
      background-position: center;  /* Centraliza a imagem */
      height: 100vh;                /* Ocupa 100% da altura do ecrã */
      color: white;                 /* Cor do texto para contraste */
    }

    /* Estilos do menu de navegação */
    nav {
      background-color: #2c3e50;
      padding: 1em 2em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Logótipo dentro do menu */
    nav .logo {
      color: #ecf0f1;
      font-size: 1.5em;
      font-weight: bold;
    }

    /* Lista de navegação */
    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5em;
      margin: 0;
      padding: 0;
    }

    /* Links dentro do menu */
    nav ul li a {
      text-decoration: none;
      color: #ecf0f1;
      transition: color 0.3s;
      font-weight: 500;
    }

    /* Efeito ao passar o rato por cima dos links */
    nav ul li a:hover {
      color: #1abc9c;
    }

    /* Estilos responsivos para ecrãs pequenos */
    @media (max-width: 768px) {
      nav ul {
        flex-direction: column;
        background-color: #34495e;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        display: none; /* Esconde o menu inicialmente no telemóvel */
      }

      nav ul.active {
        display: flex; /* Mostra o menu ao clicar no ícone */
      }

      .menu-toggle {
        cursor: pointer;
        font-size: 1.5em;
        color: #ecf0f1;
        display: block;
      }
    }

    /* Ícone do menu (☰) escondido por padrão em ecrãs grandes */
    .menu-toggle {
      display: none;
    }
	  .content {
      padding: 40px;
      background-color: rgba(0,0,0,0.4);
      margin: 50px auto;
      max-width: 800px;
      border-radius: 10px;
    }
	p:hover, ul:hover {
        transform: scale(1.02);
        text-shadow: 2px 2px 10px rgba(15,255,80,0.7);
        transition: all 0.3s ease-in-out;
    }
 
  </style>
</head>
<body>

  <!-- Início da secção principal -->
  <section>
    <!-- Barra de navegação -->
    <nav>
      <div class="logo">⚽ LOKObol</div>
      <!-- Botão do menu para dispositivos móveis -->
      <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      <!-- Lista de opções do menu -->
      <ul id="menu">
        <li><a href="futebol 2.html">História</a></li>
        <li><a href="futebol 3.html">Regras</a></li>
        <li><a href="futebol 4.html">Principais ligas</a></li>
        <li><a href="futebol 5.html">Títulos mais importantes</a></li>
      </ul>
    </nav>

    <!-- Caixa de boas-vindas -->
    <div class="content">
      <h1 align="center" style="color:white;">⚽ Bem-vindo ao mundo do futebol ⚽</h1>
      <h4 align="center" style="color:white;">Nesta página vais descobrir tudo sobre futebol</h4>
    </div>
  </section>

  <!-- Script para alternar o menu nos dispositivos móveis -->
  <script>
    function toggleMenu() {
      document.getElementById('menu').classList.toggle('active');
    }
  </script>

</body>
</html>
